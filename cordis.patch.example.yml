# ═══════════════════════════════════════════════════════════════════════════
# paeonia-guardrail 的配置示例
# ═══════════════════════════════════════════════════════════════════════════
#
# ⚠️ **这份是「示例」，不是「配置」** —— 两者不同：
#    · 示例里凡是 <尖括号> 的，都是**要你按自己机器填的**
#    · 真正的配置里不该出现尖括号
#
# ⚠️ **空字符串（`''`）= 关掉那一项** —— 所有路径项都支持这样关掉。
#    除了 `refuseCap`（熔断上限），**每一项都能不填，插件照常工作**。
#
# ⚠️ 而这份文件**放在哪、叫什么**，取决于你的 DSH 版本 —— 以官方文档为准。

# 这一段的名字（`guardrail:` 之类）要和你 DSH 那份 patch 文件的约定一致。
guardrail:
  # ── 熔断 ────────────────────────────────────────────────────────────
  # 连续被拒几次之后自动放行（**绝不用「无限拦」惩罚「诚实报告卡住」的人**）。
  # ⚠️ 这个是**唯一**建议保留数值的一项；不填会用代码默认（5）。
  refuseCap: 5

  # ── 数据文件（**改它们不用重启**）──────────────────────────────────
  # 规则表：改这里 = 改一条规则，下次判据生效时自动看到。
  # ⚠️ 读不到 / 格式坏 / schema 不认 / 某条非法 → **整份回落到代码默认**（不会全放行）。
  rulesData: '<your-plugin-dir>/lib/rules-data.json'

  # 阈值表：和规则表**同一套机制**（读不到 → 回落代码默认，不是「没有阈值」）。
  thresholdsData: '<your-plugin-dir>/lib/thresholds.json'

  # ── 解析闸（判据来自解析器，不是我们的正则）────────────────────────
  # 写入 .py/.js 之前先问一句「它解析得了吗」。
  # ⚠️ **它的判据来自权威工具，所以它不参与熔断**（见 rules-data.json 的 authoritativeNote）。
  parseCheck: true
  parseMaxBytes: 2097152      # 超过这个大小的内容不查（成本）
  parseTimeoutMs: 4000        # 单次解析的时间上限

  # ── 坑清单 / 自报池 / 台账（**下面三项都是「我们的实例」用的，你可以不填**）──
  # ⚠️ 而这三项**正是「五步」里那几个数据文件的位置** ——
  #    要挖你自己的坑，就得有它们（形状见 README「怎么挖你自己的坑」）。
  pitfallList: '<your-data-dir>/pitfall-list.json'   # 归好类的坑（机器读的那份）
  reportsPath: '<your-data-dir>/reports.jsonl'       # 自报池（只进不出）
  ledgerPath: '<your-data-dir>/ledger.jsonl'         # 台账（每次拦/提示都记一条）
  triagePath: '<your-data-dir>/pitfall-triage.jsonl' # 已审台账（**「判定不进清单」也要留痕**）

  # ── 会话级提示（**要能关**，别变成每次会话都响的墙纸）────────────────
  sessionNotice: true

  # ── 「待归类」的展开（**让它本次会话就绪**）──────────────────────────
  # ⚠️ 这一步本来要人记得跑 —— 所以改成**在注入之前同步跑一次**。
  #    而它很便宜（我们量过：池子 14 行 → 58 ms，≈3.1 ms/行
  #    → **安全边界：池子 < ~500 行**）。
  # ⚠️ 跑不了/超时 → **回落成原句**（**别因为展开不了就不报**）。
  pendingExpanded: '<your-data-dir>/pending-expanded.json'
  expandScript: '<your-scripts-dir>/expand_pending.py'
  expandTimeoutMs: 3000

  # ── 后台对账（**可选**）──────────────────────────────────────────────
  # ⚠️ 它是**异步 spawn**（detached + unref）→ **不挡启动**，但**本次会话读到的是上次的产物**。
  #    所以它用在"审计"这类"慢一点没关系"的活上，**别用在需要"本次就绪"的地方**。
  # ⚠️ 它是**只读**的（不会锁文件），而它可能会读到"正在被追加的日志" → **跳过读不了的那个**。
  rescanScript: '<your-scripts-dir>/sandbox_check.py'
  rescanStampPath: '<your-data-dir>/rescan-stamp.log'
  rescanStaleHours: 24        # 距上次超过这么多小时才再跑（**它一次要几十秒**）

  # ── 整树对账的结果提示 ───────────────────────────────────────────────
  # ⚠️ 读的是**上次的产物**，而注入里会**标明「这份产物是什么时候跑的」** ——
  #    **旧数据当成新的，比没有数据更坏。**
  reconcileReport: '<your-data-dir>/sandbox-report.json'

  # ── 指标登记表（**可选**：只在你想管住"手写的指标数字"时才需要）──────
  metricRegistry: '<your-data-dir>/registry.json'

# ═══════════════════════════════════════════════════════════════════════════
# 三条关于"填什么"的说明
# ═══════════════════════════════════════════════════════════════════════════
#
# ① **路径一律用绝对路径** —— 相对路径会相对于"宿主进程的工作目录"，
#    而那个目录是什么，你多半不想猜。
#
# ② **本示例里没有出现任何具体的盘符或用户名** ——
#    如果你在别人的配置里看到**带盘符的绝对路径**（Windows 那种「一个字母 + 冒号」），
#    或者看到**某个人的用户目录名**，那份配置是**从别人机器上抄来的**，
#    **而它在你机器上多半会崩**（或者更坏：静默地指向一个不该指的地方）。
# ⚠️ 而这条注释本身就示范了那条纪律：**警告里也别写具体值** ——
#    **写具体值就会被扫描器当成「真的出现了」**（我们就是这么发现的：
#    这份示例第一次扫出来有 1 处盘符，而它出在这条警告里）。
#
# ③ **Python 是可选的** —— 上面的 `expandScript` / `rescanScript` 都是可选依赖。
#    不装 Python：把那两行设成 `''`，**插件本体照常工作**，只是少了那两个后台助手。
